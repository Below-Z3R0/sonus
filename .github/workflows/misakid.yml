name: misakid

on:
  workflow_dispatch:

concurrency:
  group: misakid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./sidecars/misakid
          push: true
          tags: |
            ghcr.io/below-z3r0/misakid:1
            ghcr.io/below-z3r0/misakid:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Below-Z3R0/sonus
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test
        run: docker run --rm ghcr.io/below-z3r0/misakid:${{ github.sha }} python -c "import main"
