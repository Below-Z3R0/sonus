services:
  misakid:
    image: ghcr.io/below-z3r0/misakid:1
    build: ./sidecars/misakid
    restart: unless-stopped
    expose:
      - "9200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  auris:
    image: ghcr.io/below-z3r0/sonus:${VARIANT:-cpu}
    command: ["aurisd", "--addr", "0.0.0.0:9101"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9101:9101"
    volumes:
      - ${SONUS_HOME:-${HOME}/.local/share/sonus}/models:/models
      - ${SONUS_HOME:-${HOME}/.local/share/sonus}/data:/data
      - ${SONUS_MEDIA:-${HOME}/Media}:/media:ro
    environment:
      SONUS_MODELS_DIR: /models
      SONUS_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9101/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vox:
    image: ghcr.io/below-z3r0/sonus:${VARIANT:-cpu}
    command: ["voxd", "--addr", "0.0.0.0:9102"]
    restart: unless-stopped
    depends_on:
      misakid:
        condition: service_healthy
    ports:
      - "127.0.0.1:9102:9102"
    volumes:
      - ${SONUS_HOME:-${HOME}/.local/share/sonus}/models:/models
      - ${SONUS_HOME:-${HOME}/.local/share/sonus}/data:/data
      - ${SONUS_HOME:-${HOME}/.local/share/sonus}/output:/output
    environment:
      SONUS_MODELS_DIR: /models
      SONUS_DATA_DIR: /data
      SONUS_PHONEMIZER_URL: http://misakid:9200
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9102/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
