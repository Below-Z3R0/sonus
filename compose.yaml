services:
  misakid:
    image: ghcr.io/below-z3r0/misakid:1
    build: ./sidecars/misakid
    restart: unless-stopped
    expose:
      - "9200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp:
    image: ghcr.io/below-z3r0/sonus:${IMAGE:-cpu-latest}
    command: ["sonus-mcp", "--addr", "0.0.0.0:9201", "--vox", "http://vox:9102", "--auris", "http://auris:9101", "--stream", "http://stream:9103"]
    restart: unless-stopped
    depends_on:
      vox:
        condition: service_healthy
      auris:
        condition: service_healthy
      stream:
        condition: service_healthy
    ports:
      - "127.0.0.1:9201:9201"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9201/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  stream:
    image: ghcr.io/below-z3r0/sonus:${IMAGE:-cpu-latest}
    command: ["streamd", "--addr", "0.0.0.0:9103"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9103:9103"
    volumes:
      - ${SONUS_HOME:-${HOME}/Services/sonus}/models:/models
      - ${SONUS_HOME:-${HOME}/Services/sonus}/data:/data
    environment:
      SONUS_MODELS_DIR: /models
      SONUS_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9103/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  auris:
    image: ghcr.io/below-z3r0/sonus:${IMAGE:-cpu-latest}
    command: ["aurisd", "--addr", "0.0.0.0:9101"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9101:9101"
    volumes:
      - ${SONUS_HOME:-${HOME}/Services/sonus}/models:/models
      - ${SONUS_HOME:-${HOME}/Services/sonus}/data:/data
      - ${SONUS_MEDIA:-${HOME}/Media}:/media:ro
    environment:
      SONUS_MODELS_DIR: /models
      SONUS_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9101/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vox:
    image: ghcr.io/below-z3r0/sonus:${IMAGE:-cpu-latest}
    command: ["voxd", "--addr", "0.0.0.0:9102"]
    restart: unless-stopped
    depends_on:
      misakid:
        condition: service_healthy
    ports:
      - "127.0.0.1:9102:9102"
    volumes:
      - ${SONUS_HOME:-${HOME}/Services/sonus}/models:/models
      - ${SONUS_HOME:-${HOME}/Services/sonus}/data:/data
      - ${SONUS_HOME:-${HOME}/Services/sonus}/output:/output
    environment:
      SONUS_MODELS_DIR: /models
      SONUS_DATA_DIR: /data
      SONUS_PHONEMIZER_URL: http://misakid:9200
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9102/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
